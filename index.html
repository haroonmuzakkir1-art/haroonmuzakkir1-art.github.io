<script>
const CONFIG={
  DEFAULT_MODE:"IMAGES",
  VIDEO_FILE:"./sk_video.mp4",
  IMAGES:["./sk_01.jpg","./sk_02.jpg","./sk_03.jpg","./sk_04.jpg","./sk_05.jpg","./sk_06.jpg"],
  IMAGE_DURATION:9000
};

const ZONES=[
 {id:"ind",city:"INDIA",tz:"Asia/Kolkata",session:null},
 {id:"ny",city:"NEW YORK",tz:"America/New_York",session:{open:570,close:960}},
 {id:"ldn",city:"LONDON",tz:"Europe/London",session:{open:480,close:990}},
 {id:"tok",city:"TOKYO",tz:"Asia/Tokyo",session:{open:540,close:900}}
];
const prev={};let alertTimer,clockRAF;

function zoneParts(date,tz){
 const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).formatToParts(date);
 const g=t=>p.find(x=>x.type===t)?.value;let h=+g("hour");if(h===24)h=0;
 return {weekday:g("weekday"),hour:h,minute:+g("minute"),second:+g("second")};
}
const weekend=w=>w==="Sat"||w==="Sun", pad=n=>String(n).padStart(2,"0");
function remain(sec){sec=Math.max(0,Math.floor(sec));let d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);return d?`${d}D ${h}H ${pad(m)}M`:`${h}H ${pad(m)}M`}
function toOpen(z,p){let cur=p.hour*60+p.minute+p.second/60,t=z.session.open;if(!weekend(p.weekday)&&cur<t)return(t-cur)*60;let di=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday),days=1;while([0,6].includes((di+days)%7))days++;return(1440-cur+(days-1)*1440+t)*60}
function sess(z,p){
 if(!z.session)return{open:false,progress:0,label:"HOME",count:"LOCAL REFERENCE"};
 let cur=p.hour*60+p.minute+p.second/60,open=!weekend(p.weekday)&&cur>=z.session.open&&cur<z.session.close;
 // Progress means ELAPSED SESSION TIME: 0% at open, 100% at close.
 // Example: New York is configured 09:30–16:00 = 6.5 hours.
 // With about 3 hours remaining, roughly 3.5 hours have elapsed, so ~54% filled is correct.
 if(open)return{open:true,progress:(cur-z.session.open)/(z.session.close-z.session.open),label:"OPEN",count:`CLOSES IN ${remain((z.session.close-cur)*60)}`};
 return{open:false,progress:0,label:"CLOSED",count:`OPENS IN ${remain(toOpen(z,p))}`};
}
function buildClocks(){
 let root=document.getElementById("clocks");
 ZONES.forEach(z=>{
  let c=document.createElement("div");c.className="clock-card";c.id=z.id+"-card";
  c.innerHTML=`<div class="card-top"><i class="dot"></i><span class="city">${z.city}</span><span class="state" id="${z.id}-state"></span></div>
  <div class="dial-wrap"><div class="square-progress"></div><svg class="progress-svg" viewBox="0 0 104 104"><circle class="track" cx="52" cy="52" r="48"/><circle class="progress" id="${z.id}-progress" cx="52" cy="52" r="48"/></svg>
  <div class="dial" id="${z.id}-dial"><div class="hand hour" id="${z.id}-h"></div><div class="hand minute" id="${z.id}-m"></div><div class="hand second" id="${z.id}-s"></div><div class="pin"></div></div></div>
  <div class="digital"><span id="${z.id}-time"></span><span class="ampm" id="${z.id}-ampm"></span></div><div class="date" id="${z.id}-date"></div><div class="count" id="${z.id}-count"></div>`;
  if(z.id==="ind"){
     const toggle=document.createElement("button");
     toggle.className="dial-mode-dot";
     toggle.id="dialModeDot";
     toggle.type="button";
     toggle.title="Round / square analog clocks";
     toggle.setAttribute("aria-label","Switch analog clock shape");
     toggle.addEventListener("click",(e)=>{e.stopPropagation();toggleDialShape()});
     c.appendChild(toggle);
   }
   root.appendChild(c);
  let dial=c.querySelector(".dial");
  for(let i=0;i<60;i++){let mk=document.createElement("i");mk.className="marker"+(i%5===0?" major":"");mk.style.transform=`translate(-50%,-50%) rotate(${i*6}deg)`;dial.insertBefore(mk,dial.firstChild)}
  for(let n=1;n<=12;n++){let a=n*30*Math.PI/180,x=50+39*Math.sin(a),y=50-39*Math.cos(a),el=document.createElement("span");el.className="num";el.textContent=n;el.style.left=x+"%";el.style.top=y+"%";dial.appendChild(el)}
 });
}
function showAlert(t,s){let a=document.getElementById("alert");document.getElementById("alertTitle").textContent=t;document.getElementById("alertSub").textContent=s;a.classList.add("show");clearTimeout(alertTimer);alertTimer=setTimeout(()=>a.classList.remove("show"),4000)}
function updateClockText(){
 let now=new Date(),opens={};
 ZONES.forEach(z=>{
  let p=zoneParts(now,z.tz),st=sess(z,p);opens[z.id]=st.open;let h=p.hour%12||12;
  document.getElementById(z.id+"-time").textContent=`${pad(h)}:${pad(p.minute)}:${pad(p.second)}`;
  document.getElementById(z.id+"-ampm").textContent=p.hour>=12?" PM":" AM";
  document.getElementById(z.id+"-date").textContent=new Intl.DateTimeFormat("en-US",{timeZone:z.tz,weekday:"short",month:"short",day:"numeric"}).format(now);
  let se=document.getElementById(z.id+"-state");se.textContent=st.label;se.className="state "+(st.open?"open":"");
  document.getElementById(z.id+"-count").textContent=st.count;
  let card=document.getElementById(z.id+"-card");card.classList.toggle("active",st.open);
  let prog=Math.max(0,Math.min(1,st.progress));
   document.getElementById(z.id+"-progress").style.strokeDashoffset=301.6*(1-prog);
   const wrap=document.getElementById(z.id+"-dial").parentElement;
   wrap.style.setProperty("--progress",prog);
   wrap.dataset.progress=Math.round(prog*100);
  if(z.session&&prev[z.id]!==undefined&&prev[z.id]!==st.open){card.classList.remove("sweep");void card.offsetWidth;card.classList.add("sweep");showAlert(z.city,st.open?"SESSION ACTIVE":"SESSION CLOSED")}
  prev[z.id]=st.open;
 });
 document.getElementById("overlap").classList.toggle("show",opens.ny&&opens.ldn);
}
// Lightweight clock-hand update. Avoids expensive timezone formatting on every animation frame.
// This keeps Android/mobile rendering sharp and leaves the ticker animation smooth.
function updateHands(){
 const now=new Date(),frac=now.getMilliseconds()/1000;
 ZONES.forEach(z=>{
  const p=zoneParts(now,z.tz);
  const smoothS=p.second+frac,smoothM=p.minute+smoothS/60,smoothH=(p.hour%12)+smoothM/60;
  document.getElementById(z.id+"-h").style.transform=`rotate(${smoothH*30}deg)`;
  document.getElementById(z.id+"-m").style.transform=`rotate(${smoothM*6}deg)`;
  document.getElementById(z.id+"-s").style.transform=`rotate(${smoothS*6}deg)`;
 });
 requestAnimationFrame(updateHands);
}



// MEDIA

// Adaptive media fitting: protects small screens from heavy side-cropping,
// while filling the media box when the aspect ratios are sufficiently close.
function applyAdaptiveFit(el){
 if(!el)return;
 const box=document.getElementById("media");
 if(!box)return;

 // Phones / very narrow displays: show the complete media without cutting sides.
 // Laptop, monitor and TV displays: fill the media box completely, eliminating black bars.
 const smallScreen=window.innerWidth<=900;
 el.classList.toggle("fit-contain",smallScreen);
 el.classList.toggle("fit-cover",!smallScreen);
}
function refitVisibleMedia(){
 [A,B,V].forEach(el=>{if(el.classList.contains("show"))applyAdaptiveFit(el)});
}

const A=document.getElementById("imgA"),B=document.getElementById("imgB"),V=document.getElementById("video");
V.addEventListener("loadedmetadata",()=>applyAdaptiveFit(V));
window.addEventListener("resize",()=>requestAnimationFrame(refitVisibleMedia));
let active=A,standby=B,imgIndex=0,timer=null,currentMode="";
function savedMode(){try{return localStorage.getItem("skEnterprisesMediaMode")||CONFIG.DEFAULT_MODE}catch(e){return CONFIG.DEFAULT_MODE}}
function saveMode(m){try{localStorage.setItem("skEnterprisesMediaMode",m)}catch(e){}}
function loadImg(el,src){return new Promise(r=>{el.onload=()=>{applyAdaptiveFit(el);r()};el.onerror=r;el.src=src})}
async function swapImage(i){await loadImg(standby,CONFIG.IMAGES[i%CONFIG.IMAGES.length]);standby.classList.remove("show");void standby.offsetWidth;standby.classList.add("show");applyAdaptiveFit(standby);active.classList.remove("show");[active,standby]=[standby,active]}
async function imagesMode(){
 V.pause();V.classList.remove("show");imgIndex=0;await swapImage(0);
 const next=async()=>{imgIndex=(imgIndex+1)%CONFIG.IMAGES.length;await swapImage(imgIndex);timer=setTimeout(next,CONFIG.IMAGE_DURATION)};timer=setTimeout(next,CONFIG.IMAGE_DURATION)
}
function videoMode(loop=true){A.classList.remove("show");B.classList.remove("show");V.src=CONFIG.VIDEO_FILE;V.loop=loop;V.muted=true;V.classList.add("show");applyAdaptiveFit(V);V.play().catch(()=>{})}
async function mixedMode(){
 V.loop=false;
 const cycle=async i=>{V.pause();V.classList.remove("show");await swapImage(i);if(i<CONFIG.IMAGES.length-1)timer=setTimeout(()=>cycle(i+1),CONFIG.IMAGE_DURATION);else timer=setTimeout(()=>{A.classList.remove("show");B.classList.remove("show");V.src=CONFIG.VIDEO_FILE;V.classList.add("show");V.play().catch(()=>cycle(0))},CONFIG.IMAGE_DURATION)};
 V.onended=()=>cycle(0);cycle(0)
}
function setMode(m){
 clearTimeout(timer);V.onended=null;V.pause();currentMode=m;saveMode(m);
 
 document.querySelectorAll(".menu button").forEach(b=>b.classList.toggle("selected",b.dataset.mode===m));
 document.getElementById("menu").classList.remove("show");
 if(m==="VIDEO")videoMode(true);else if(m==="MIXED")mixedMode();else imagesMode()
}
function toggleDeskMenu(e){e.stopPropagation();document.getElementById("menu").classList.toggle("show")}
function chooseMode(m,e){e.stopPropagation();setMode(m)}
document.addEventListener("click",()=>document.getElementById("menu").classList.remove("show"));
document.getElementById("media").addEventListener("click",(e)=>{
 if(e.target.closest(".status,.desk-menu,.media-menu,.menu,.full,.shape-toggle,.dial-mode-dot"))return;
 if(V.classList.contains("show")){
   if(V.paused)V.play().catch(()=>{});else V.pause();
 }
});
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}

function buildTicker(){
 const x=['<span class="g">✦</span> WELCOME TO <span class="g">SK ENTERPRISES</span> <span class="g">✦</span>','YOUR PARTNER IN FINANCIAL GROWTH','<span class="g">✦</span> GLOBAL MARKETS DESK <span class="g">✦</span>','FOREX • COMMODITIES • GLOBAL MARKETS','GLOBAL MARKETS • TRADING • RESEARCH • FINANCIAL GROWTH'];
 document.getElementById("ticker").innerHTML=[...x,...x].map(v=>`<span>${v}</span>`).join("")
}

function savedDialShape(){try{return localStorage.getItem("skDialShape")||"round"}catch(e){return "round"}}
function setDialShape(shape){
 const square=shape==="square";
 document.body.classList.toggle("square-dials",square);
 const b=document.getElementById("dialModeDot");
 if(b){b.classList.toggle("square-on",square);b.title=square?"Square clocks — tap for round":"Round clocks — tap for square"}
 try{localStorage.setItem("skDialShape",square?"square":"round")}catch(e){}
}
function toggleDialShape(){setDialShape(document.body.classList.contains("square-dials")?"round":"square")}

window.addEventListener("load",()=>{
 buildClocks();buildTicker();setDialShape(savedDialShape());updateClockText();updateHands();setInterval(updateClockText,1000);setMode(savedMode());
 setTimeout(()=>{let b=document.getElementById("boot");b.classList.add("hide");setTimeout(()=>b.style.display="none",900)},2800)
});
</script>
